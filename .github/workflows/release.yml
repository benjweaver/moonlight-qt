---
name: Release
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  appimage:
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ github.ref_name }}

  flatpak:
    uses: ./.github/workflows/build-flatpak.yml
    with:
      ci_version: ${{ github.ref_name }}

  steamlink:
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ github.ref_name }}

  win-mac:
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ github.ref_name }}

  publish:
    needs: [appimage, flatpak, steamlink, win-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Package the platform builds
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p assets

          # Already distributable, just collect them
          cp dist/Moonlight-LinuxAppImage-"$TAG"/*.AppImage assets/
          cp dist/Moonlight-Flatpak-"$TAG"/*.flatpak assets/
          cp dist/Moonlight-macOS-"$TAG"/*.dmg assets/

          # The Windows and Steam Link jobs upload unpacked build trees, so
          # zip each one into a single asset
          for arch in x64 arm64; do
            (cd dist/Moonlight-Windows-"$arch"-"$TAG" && zip -qr - .) \
              > assets/MoonlightPortable-"$arch"-"$TAG".zip
          done
          (cd dist/Moonlight-SteamLink-"$TAG" && zip -qr - .) \
            > assets/Moonlight-SteamLink-"$TAG".zip

          ls -la assets/

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          Unofficial build of [moonlight-qt](https://github.com/moonlight-stream/moonlight-qt),
          built from upstream \`master\` at \`${GITHUB_SHA::10}\` plus the automatic
          display mode patch. Not affiliated with the Moonlight project - please do not
          report issues with these builds to them.

          ### Install

          **Flatpak** (updates through Discover once installed):
          \`\`\`
          flatpak install --user ./Moonlight-${GITHUB_REF_NAME}-x86_64.flatpak
          \`\`\`

          **AppImage** (self-contained, no install):
          \`\`\`
          chmod +x Moonlight-${GITHUB_REF_NAME}-x86_64.AppImage
          ./Moonlight-${GITHUB_REF_NAME}-x86_64.AppImage
          \`\`\`

          Windows (portable x64/arm64), macOS and Steam Link builds are also attached.

          > The Windows and macOS builds are **unsigned**. Windows SmartScreen will
          > warn about an unrecognised app, and macOS Gatekeeper will refuse to open
          > the app until you allow it under Settings > Privacy & Security. Signing
          > these needs paid developer certificates, which this fork doesn't have.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            assets/*
